<!doctype html>
<html lang="de" data-theme="material">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Stammbaum — wer ist noch mal wer?" />
    <meta name="theme-color" content="#6750a4" />
    <title>Stammbaum</title>
  </head>
  <body>
    <div id="app">
      <header class="app-bar">
        <a class="app-title" href="#/" id="family-title">Stammbaum</a>
        <div class="app-actions"></div>

        <div class="search" role="search">
          <input
            id="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Wer ist das?"
            aria-label="Person suchen"
            aria-expanded="false"
          />
          <ul id="results" class="results" role="listbox" hidden></ul>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
